
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#162C87">

  <title>NPOR | Central de Aplicativos</title>

  <!-- BRASÃO E ÍCONE DO IPHONE -->
  <link rel="icon" type="image/png" href="./brasao-sao-luis.png">
  <link rel="apple-touch-icon" href="./brasao-sao-luis.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NPOR">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    :root {
      --azul: #162C87;
      --azul-claro: #2097D6;
      --verde: #009B59;
      --amarelo: #DFAD43;
      --vermelho: #E33236;
      --fundo: #F5F7FB;
      --texto: #192743;
      --cinza: #728097;
      --borda: #E5EAF2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--fundo);
      color: var(--texto);
      font-family: 'Segoe UI', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .barra-cores {
      height: 6px;
      background: linear-gradient(
        90deg,
        var(--verde) 0 27%,
        var(--amarelo) 27% 48%,
        var(--azul) 48% 79%,
        var(--vermelho) 79% 100%
      );
    }

    header {
      background: white;
      border-bottom: 1px solid var(--borda);
    }

    .header-interno {
      max-width: 1150px;
      margin: auto;
      padding: 20px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brasao {
      width: 69px;
      height: 77px;
      object-fit: contain;
    }

    .marca h1 {
      margin: 0;
      color: var(--azul);
      font-size: 29px;
      font-weight: 850;
      letter-spacing: 3px;
    }

    .marca p {
      margin: 4px 0 0;
      color: var(--cinza);
      font-size: 13px;
    }

    .identificacao {
      background: #EAF8F1;
      color: var(--verde);
      padding: 9px 16px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
    }

    main {
      max-width: 1150px;
      margin: 0 auto;
      padding: 50px 30px 70px;
    }

    .subtitulo {
      color: var(--verde);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .titulo-principal {
      font-size: clamp(29px, 4vw, 43px);
      letter-spacing: -1.5px;
      line-height: 1.2;
      margin: 12px 0;
      color: var(--azul);
    }

    .descricao {
      color: var(--cinza);
      font-size: 15px;
      margin: 0;
      line-height: 1.7;
    }

    .ferramentas {
      margin-top: 38px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .campo-busca {
      width: 390px;
      max-width: 100%;
      height: 51px;
      background: white;
      border: 1px solid var(--borda);
      border-radius: 13px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      box-shadow: 0 4px 16px rgba(22,44,135,.035);
    }

    .icone-busca {
      font-size: 21px;
      margin-right: 12px;
      color: var(--cinza);
    }

    .campo-busca input {
      border: none;
      outline: none;
      background: transparent;
      flex: 1;
      min-width: 0;
      color: var(--texto);
      font-size: 14px;
    }

    .quantidade {
      color: var(--cinza);
      font-size: 13px;
    }

    .grade {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      position: relative;
      background: white;
      min-height: 180px;
      padding: 25px;
      border-radius: 17px;
      border: 1px solid var(--borda);
      text-decoration: none;
      color: var(--texto);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(30,48,92,.045);
      transition:
        transform .22s,
        box-shadow .22s;
    }

    .card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      height: 4px;
      background: var(--verde);
    }

    .card:nth-child(4n+2)::before {
      background: var(--azul-claro);
    }

    .card:nth-child(4n+3)::before {
      background: var(--amarelo);
    }

    .card:nth-child(4n+4)::before {
      background: var(--azul);
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-5px);
      border-color: #C9D5E7;
      box-shadow: 0 16px 35px rgba(30,48,92,.12);
      outline: none;
    }

    .card-topo {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .icone-app {
      height: 48px;
      width: 48px;
      border-radius: 13px;
      background: #EDF2FF;
      color: var(--azul);
      font-weight: 800;
      font-size: 21px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .seta {
      font-size: 25px;
      color: var(--verde);
    }

    .nome-app {
      font-size: 18px;
      font-weight: 750;
      margin-top: 20px;
      overflow-wrap: anywhere;
    }

    .abrir {
      font-size: 12px;
      margin-top: 6px;
      color: var(--cinza);
    }

    .estado {
      grid-column: 1/-1;
      padding: 50px 20px;
      text-align: center;
      background: white;
      border: 1px dashed #CDD6E5;
      border-radius: 15px;
      color: var(--cinza);
    }

    footer {
      padding: 26px 20px;
      text-align: center;
      color: #8995A7;
      font-size: 12px;
      border-top: 1px solid var(--borda);
    }

    @media(max-width: 850px) {
      .grade {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media(max-width: 550px) {
      .header-interno {
        padding: 16px 20px;
      }

      .brasao {
        width: 53px;
        height: 61px;
      }

      .marca {
        gap: 12px;
      }

      .marca h1 {
        font-size: 24px;
      }

      .identificacao {
        display: none;
      }

      main {
        padding: 35px 20px 55px;
      }

      .titulo-principal {
        font-size: 30px;
      }

      .campo-busca {
        width: 100%;
      }

      .grade {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .card {
        min-height: 150px;
      }
    }

    @media(prefers-reduced-motion: reduce) {
      .card {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <div class="barra-cores"></div>

  <header>
    <div class="header-interno">

      <div class="marca">

        <img
          src="./brasao-sao-luis.png"
          class="brasao"
          alt="Brasão NPOR"
        >

        <div>
          <h1>NPOR</h1>
          <p>Central de Aplicativos</p>
        </div>

      </div>

      <span class="identificacao">
        Portal Integrado
      </span>

    </div>
  </header>

  <main>

    <div class="subtitulo">
      Seu espaço digital
    </div>

    <h2 class="titulo-principal">
      Tudo o que você precisa,<br>
      em um só lugar.
    </h2>

    <p class="descricao">
      Acesse seus sistemas e ferramentas de forma
      simples, rápida e organizada.
    </p>

    <div class="ferramentas">

      <label class="campo-busca">
        <span class="icone-busca" aria-hidden="true">
          &#9906;
        </span>

        <input
          type="search"
          id="pesquisa"
          placeholder="Buscar aplicativo..."
          aria-label="Buscar aplicativo"
        >
      </label>

      <div class="quantidade" id="contador"></div>

    </div>

    <section
      class="grade"
      id="gradeApps"
      aria-live="polite"
    ></section>

  </main>

  <footer>
    NPOR &bull; Central de Aplicativos
  </footer>

  <script>

    /* =========================================
       NPOR - CENTRAL DE APLICATIVOS
       EXIBIÇÃO INSTANTÂNEA
       SINCRONIZAÇÃO SILENCIOSA
       ORDEM DEFINIDA PELO GOOGLE SHEETS
    ========================================= */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbyz7vdrGivIgqY0UJ5zFRfYBlG48GxjM31-2ZjL6WjXMifVAkvbWcexIlYwInuY7skIZg/exec';

    const CACHE_KEY = 'NPOR_APPS_V3';

    /*
       LISTA INICIAL PROVISÓRIA

       Usada somente quando o dispositivo
       ainda não possui dados armazenados.

       Após a primeira sincronização,
       a planilha passa a definir os aplicativos
       e sua ordem.
    */

    const APPS_INICIAIS = [
      {
        nome: 'F.O',
        link: 'https://fsanchesa.github.io/imagem/'
      },
      {
        nome: 'GAMEFICAÇÃO',
        link: 'https://script.google.com/macros/s/AKfycbxA7elKjTfdrlaEXKbUWiJx1BWKZ69-6XlDJwEArvBQuW5u7hH30aumY1tfuyeHt5e2Gg/exec'
      }
    ];

    const grade =
      document.getElementById('gradeApps');

    const contador =
      document.getElementById('contador');

    const pesquisa =
      document.getElementById('pesquisa');

    let aplicativos = [];
    let temporizador = null;
    let ultimaSincronizacao = 0;
    let sincronizando = false;

    /* =========================================
       CARREGAMENTO IMEDIATO DO CACHE
    ========================================= */

    function recuperarAplicativos() {

      try {

        const salvos =
          localStorage.getItem(CACHE_KEY);

        if (salvos !== null) {

          const lista = JSON.parse(salvos);

          if (Array.isArray(lista)) {
            return lista;
          }

        }

      } catch (erro) {
        console.warn(
          'Não foi possível recuperar o cache.',
          erro
        );
      }

      return APPS_INICIAIS.map(app => ({ ...app }));
    }

    /* =========================================
       ARMAZENAMENTO LOCAL
    ========================================= */

    function salvarAplicativos() {

      try {

        localStorage.setItem(
          CACHE_KEY,
          JSON.stringify(aplicativos)
        );

      } catch (erro) {
        console.warn(
          'Armazenamento local indisponível.',
          erro
        );
      }
    }

    /* =========================================
       EXIBIR APLICATIVOS
    ========================================= */

    function renderizarApps() {

      const termo = pesquisa.value
        .trim()
        .toLocaleLowerCase('pt-BR');

      /*
         Não utilizamos ordenação alfabética.
         A ordem recebida do Sheets é preservada.
      */

      const filtrados = aplicativos.filter(app => {

        return String(app.nome || '')
          .toLocaleLowerCase('pt-BR')
          .includes(termo);

      });

      contador.textContent =
        filtrados.length +
        (filtrados.length === 1
          ? ' aplicativo disponível'
          : ' aplicativos disponíveis');

      grade.replaceChildren();

      if (filtrados.length === 0) {

        const mensagem = document.createElement('div');

        mensagem.className = 'estado';

        mensagem.textContent = termo
          ? 'Nenhum aplicativo encontrado.'
          : 'Nenhum aplicativo cadastrado.';

        grade.appendChild(mensagem);

        return;
      }

      filtrados.forEach(function(app) {

        const nomeApp = String(app.nome || '').trim();
        const linkApp = String(app.link || '').trim();

        if (
          !nomeApp ||
          !/^https:\/\/[^\s]+$/i.test(linkApp)
        ) {
          return;
        }

        const card = document.createElement('a');

        card.className = 'card';
        card.href = linkApp;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';

        const topo = document.createElement('div');
        topo.className = 'card-topo';

        const icone = document.createElement('div');
        icone.className = 'icone-app';

        icone.textContent = nomeApp
          .charAt(0)
          .toLocaleUpperCase('pt-BR');

        const seta = document.createElement('span');

        seta.className = 'seta';
        seta.textContent = '↗';
        seta.setAttribute('aria-hidden', 'true');

        topo.append(icone, seta);

        const corpo = document.createElement('div');

        const nome = document.createElement('div');
        nome.className = 'nome-app';
        nome.textContent = nomeApp;

        const abrir = document.createElement('div');
        abrir.className = 'abrir';
        abrir.textContent = 'Abrir aplicativo';

        corpo.append(nome, abrir);

        card.append(topo, corpo);

        grade.appendChild(card);

      });
    }

    /* =========================================
       COMPARAR LISTAS
    ========================================= */

    function listasDiferentes(novaLista) {

      return JSON.stringify(aplicativos) !==
             JSON.stringify(novaLista);

    }

    /* =========================================
       RECEBER GOOGLE SHEETS
    ========================================= */

    window.NPOR_RECEBER_APPS = function(resposta) {

      sincronizando = false;
      clearTimeout(temporizador);

      if (
        !resposta ||
        resposta.sucesso !== true ||
        !Array.isArray(resposta.apps)
      ) {
        console.warn(
          'Não foi possível sincronizar os aplicativos.'
        );

        return;
      }

      /*
         Valida os aplicativos recebidos,
         mantendo a ordem original das linhas.
      */

      const novaLista = resposta.apps
        .filter(app => {

          if (!app) return false;

          const nome = String(app.nome || '').trim();
          const link = String(app.link || '').trim();

          return nome &&
            /^https:\/\/[^\s]+$/i.test(link);

        })
        .map(app => ({
          nome: String(app.nome).trim(),
          link: String(app.link).trim()
        }));

      /*
         A planilha é a fonte oficial.
         Se houver alteração na ordem, nomes,
         links, inclusão ou exclusão,
         substituímos a lista inteira.
      */

      if (listasDiferentes(novaLista)) {

        aplicativos = novaLista;

        salvarAplicativos();

        renderizarApps();

      } else {

        // Mesmo sem mudanças, confirma o cache.
        salvarAplicativos();

      }

      ultimaSincronizacao = Date.now();

      console.log(
        'NPOR sincronizado:',
        novaLista.length,
        'aplicativos.'
      );

    };

    /* =========================================
       SINCRONIZAÇÃO SILENCIOSA
    ========================================= */

    function sincronizarApps() {

      if (sincronizando) return;

      sincronizando = true;

      const scriptAnterior =
        document.getElementById('apiNPOR');

      if (scriptAnterior) {
        scriptAnterior.remove();
      }

      const script = document.createElement('script');

      script.id = 'apiNPOR';

      /*
         Evita reutilizar uma resposta antiga.
         Não altera os dados no Sheets.
      */

      const separador =
        API_URL.includes('?') ? '&' : '?';

      script.src =
        API_URL +
        separador +
        't=' +
        Date.now();

      script.onerror = function() {

        sincronizando = false;
        clearTimeout(temporizador);

        console.warn(
          'NPOR: conexão indisponível. Mantendo aplicativos locais.'
        );

        // Nenhuma mensagem aparece na tela.
        // Os botões existentes permanecem.

      };

      temporizador = setTimeout(function() {

        if (sincronizando) {

          sincronizando = false;

          console.warn(
            'NPOR: consulta demorou. Mantendo aplicativos locais.'
          );

        }

      }, 20000);

      document.body.appendChild(script);

    }

    /* =========================================
       PESQUISA
    ========================================= */

    pesquisa.addEventListener(
      'input',
      renderizarApps
    );

    /* =========================================
       ATUALIZAR QUANDO VOLTAR AO APP
    ========================================= */

    document.addEventListener(
      'visibilitychange',
      function() {

        if (
          document.visibilityState === 'visible' &&
          Date.now() - ultimaSincronizacao > 30000
        ) {
          sincronizarApps();
        }

      }
    );

    /* =========================================
       INICIALIZAÇÃO INSTANTÂNEA
    ========================================= */

    // 1. Recupera o cache, ou usa a lista inicial.
    aplicativos = recuperarAplicativos();

    // 2. Exibe imediatamente os botões.
    renderizarApps();

    // 3. Consulta o Sheets silenciosamente.
    sincronizarApps();

  </script>

</body>
</html>
